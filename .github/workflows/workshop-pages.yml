name: Publicar el episodio del taller

# Copied from skills-workshop/templates/skill-pages.yml. The episode's source is workshop/episodes/;
# workshop/dist/ is built with the workshop's engine (build.py --root workshop build) and committed. This workflow
# does not build: it checks that dist/ was built from the current episodes and publishes it.

on:
  push:
    branches: [main]
    paths: ["workshop/**", ".github/workflows/workshop-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that workshop/dist was built from the current episodes
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path("workshop")
          files = [p for p in (root / "episodes").rglob("*")
                   if p.is_file() and not any(s.startswith(".") for s in p.relative_to(root).parts)]
          h = hashlib.sha256()
          for p in sorted(files, key=lambda q: q.relative_to(root).as_posix()):
              h.update(p.relative_to(root).as_posix().encode() + b"\0" + p.read_bytes() + b"\0")
          stamp = root / "dist" / "source.sha256"
          want = stamp.read_text().split()[0] if stamp.is_file() else ""
          if h.hexdigest() != want:
              print("workshop/dist is older than workshop/episodes: run "
                    "`python3 <workshop>/build.py --root workshop build` and commit workshop/dist")
              sys.exit(1)
          print("ok: workshop/dist matches workshop/episodes")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: workshop/dist
      - id: deployment
        uses: actions/deploy-pages@v4
