name: Python skill tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.skill }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add one entry per skill that owns Python scripts and a test suite.
          - skill: local-board-skill
            source_dir: skills/local-board-skill/scripts
            test_dir: skills/local-board-skill/tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check coverage
      - name: Run tests
        run: python -m unittest discover -s "${{ matrix.test_dir }}" -p "test*.py" -v
      - name: Enforce coverage
        run: |
          python -m coverage run --source="${{ matrix.source_dir }}" \
            -m unittest discover -s "${{ matrix.test_dir }}" -p "test*.py"
          python -m coverage report --fail-under=90
