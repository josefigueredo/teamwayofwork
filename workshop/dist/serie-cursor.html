<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de skills</title>
<!-- Template: build inlines tokens.css + screens.css at CSS, the episodes of ONE series
     as <script type="application/json" id="episodes">[…]</script> at EPISODES, and
     nav.js, render.js, animate.js, stage.js at JS. No external references. -->
<style>
/* Every colour, font and size of the stage. When Cursor or the terminal change, edit here.
   Sizes are for the fixed 1600x900 canvas (the stage scales it). */
:root {
  /* canvas */
  --ws-w: 1600px;
  --ws-h: 900px;

  /* fonts */
  --ws-font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ws-font-mono: "SF Mono", Menlo, Monaco, "Courier New", monospace;
  --ws-fs: 15px;          /* Cursor body text */
  --ws-fs-sm: 13.5px;     /* sidebar, tabs, footers */
  --ws-fs-xs: 12.5px;     /* section labels, ages */
  --ws-fs-h4: 19px;       /* say #### heading */
  --ws-fs-mono: 13.5px;   /* code, chips, zsh */
  --ws-fs-term: 16px;     /* personal terminal and Claude Code */
  --ws-lh: 1.6;
  --ws-lh-mono: 1.55;
  --ws-lh-tight: 1.3;     /* user label block */
  --ws-lh-list: 2;        /* file tree, Open Tabs */
  --ws-caret-w: .6em;     /* terminal caret block */

  /* spacing and radii */
  --ws-gap: 12px;
  --ws-pad: 18px;
  --ws-pad-sm: 8px;
  --ws-pad-xs: 4px;
  --ws-radius: 12px;
  --ws-radius-sm: 6px;
  --ws-radius-xs: 4px;
  --ws-line: 1px;

  /* window chrome */
  --ws-dot: 12px;
  --ws-dot-r: #ff5f57;
  --ws-dot-y: #febc2e;
  --ws-dot-g: #28c840;

  /* Cursor, light theme */
  --ws-c-bg: #ffffff;
  --ws-c-side: #f3f3f3;
  --ws-c-line: #e6e6e6;
  --ws-c-tx: #1d1d1f;
  --ws-c-tx2: #3a3a3c;
  --ws-c-mut: #7a7a7a;
  --ws-c-faint: #a0a0a0;
  --ws-c-sel: #e3e3e3;
  --ws-c-chip: #f2f2f2;
  --ws-c-code: #efefef;
  --ws-c-send-bg: #111111;
  --ws-c-send-fg: #ffffff;
  --ws-c-plus: #1a7f37;
  --ws-c-avatar: #8a7b6b;
  --ws-c-shadow: 0 1px 4px rgba(0, 0, 0, .06);
  --ws-c-sidebar-w: 250px;
  --ws-c-right-w: 680px;
  --ws-c-tree-w: 230px;
  --ws-c-zsh-h: 400px;
  --ws-c-opentabs-w: 270px;
  --ws-c-top-h: 40px;
  --ws-c-tabs-h: 40px;
  --ws-c-avatar-s: 26px;
  --ws-c-send-s: 22px;
  --ws-c-preview-fs: 28px;

  /* zsh prompt segments inside Cursor (light) */
  --ws-z-bg: #ffffff;
  --ws-z-tx: #1d1d1f;
  --ws-z-apple-bg: #ffffff;
  --ws-z-apple-fg: #111111;
  --ws-z-path-bg: #1f4f8f;
  --ws-z-path-fg: #ffffff;
  --ws-z-git-bg: #2a8a76;
  --ws-z-git-fg: #ffffff;
  --ws-z-sys-bg: #8e1f6f;
  --ws-z-sys-fg: #ffffff;
  --ws-z-time-bg: transparent;
  --ws-z-time-fg: #1d1d1f;
  --ws-z-fill: #7a7a7a;
  --ws-z-path-icon: #ffffff;
  --ws-z-sys-icon: #ffffff;
  --ws-z-time-icon: #1d1d1f;
  --ws-z-ok: #2ea043;
  --ws-z-out: #3a3a3c;

  /* personal terminal (dark) */
  --ws-t-bg: #252830;
  --ws-t-bar: #2d3139;
  --ws-t-bar-fg: #c9ced8;
  --ws-t-tx: #d7dae0;
  --ws-t-mut: #8b919c;
  --ws-t-cmd: #79c0ff;
  --ws-t-ok: #7ee000;
  --ws-t-caret: #d7dae0;
  --ws-t-apple-bg: #d0d4db;
  --ws-t-apple-fg: #111111;
  --ws-t-path-bg: #86a6cc;
  --ws-t-path-fg: #ffffff;
  --ws-t-path-icon: #ffffff;
  --ws-t-git-bg: #2f8f8a;
  --ws-t-git-fg: #ffffff;
  --ws-t-sys-bg: #b994c9;
  --ws-t-sys-fg: #1b1b22;
  --ws-t-sys-icon: #1b1b22;
  --ws-t-time-bg: #d6d9df;
  --ws-t-time-fg: #111111;
  --ws-t-time-icon: #111111;
  --ws-t-fill: #5d6370;
  --ws-t-bar-h: 34px;
  --ws-seg-slant: 8px;
  --ws-fill-w: 2px;       /* dotted fill between prompt segments */
  --ws-icon-s: 1em;       /* prompt icons (folder, house, clock), inline SVG */
  --ws-icon-gap: .4em;    /* space between a prompt icon and its text */
  --ws-icon-drop: -.14em; /* vertical-align of prompt icons on the text baseline */

  /* Claude Code tab */
  --ws-cc-accent: #d97757;
  --ws-cc-ok: #3fb950;
  --ws-cc-user: #ffa657;  /* the person's turn, as in the cc-* mockups */
  --ws-cc-bang: #f778ba;  /* a `!` command the person runs in bash mode */
  --ws-cc-box: #5d6370;
  --ws-cc-gutter: 2ch;    /* width of the ⏺ / ⎿ / > gutter */

  /* browser window of a page step */
  --ws-p-w: 92%;
  --ws-p-h: 90%;
  --ws-p-bg: #ffffff;
  --ws-p-bar: #f1f1f3;

  /* macOS approval window */
  --ws-a-scrim: rgba(0, 0, 0, .28);
  --ws-a-bg: #ececec;
  --ws-a-tx: #1d1d1f;
  --ws-a-mut: #4a4a4c;
  --ws-a-line: #d2d2d2;
  --ws-a-shadow: 0 24px 60px rgba(0, 0, 0, .35);
  --ws-a-w: 560px;
  --ws-a-radius: 14px;
  --ws-a-icon: 56px;
  --ws-a-icon-bg: #2d6cdf;
  --ws-a-btn-bg: #ffffff;
  --ws-a-btn-fg: #1d1d1f;
  --ws-a-ok-bg: #0a6cf0;
  --ws-a-ok-fg: #ffffff;
  --ws-a-fs-title: 17px;
  --ws-a-fs: 14px;
  --ws-a-lh: 1.45;
  /* the tool's own approval panel (alert.js): light or dark like macOS, because its page follows the system too */
  --ws-r-bg: #ececec;
  --ws-r-tx: #1d1d1f;
  --ws-r-bar-tx: #4a4a4c;
  --ws-r-btn-bg: #ffffff;
  --ws-r-btn-line: #c8c8c8;
  --ws-r-bar: 28px;         /* title bar */
  --ws-r-foot: 58px;        /* the button bar under the page (alert.js `bar`) */
  --ws-r-btn-h: 28px;
  --ws-r-btn-cancel: 90px;
  --ws-r-btn-ok: 130px;
  --ws-r-fs-btn: 13px;

  /* callouts on the current step (note bubble, box, underline, tag) */
  --ws-co-mark: #ff5a1f;
  --ws-co-tag-fg: #ffffff;
  --ws-co-note-bg: #fff4b8;
  --ws-co-note-tx: #3b3000;
  --ws-co-note-line: #f2cf3d;
  --ws-co-note-w: 520px;
  --ws-co-note-fs: 17px;
  --ws-co-note-shadow: 0 6px 18px rgba(0, 0, 0, .18);
  --ws-co-box-w: 3px;
  --ws-co-under-w: 3px;

  /* chapter card */
  --ws-k-grad: linear-gradient(135deg, #2d6cdf, #7a4fe0);
  --ws-k-fg: #ffffff;
  --ws-k-fs-kicker: 22px;
  --ws-k-fs-title: 88px;
  --ws-k-fs-sub: 30px;
  --ws-k-pad: 140px;
  --ws-k-sub-w: 1100px;
  --ws-k-kicker-track: .12em;
  --ws-k-kicker-op: .8;
  --ws-k-sub-op: .9;
  --ws-k-title-mt: .2em;
  --ws-k-title-mb: .3em;
  --ws-k-lh-title: 1.05;
  --ws-k-lh-sub: 1.35;
  --ws-k-pitch-mt: 56px;
  --ws-k-pitch-w: 1180px;
  --ws-k-pitch-pad: 28px 36px;
  --ws-k-pitch-bg: rgba(255, 255, 255, .12);
  --ws-k-pitch-radius: 14px;
  --ws-k-fs-pitch-k: 18px;
  --ws-k-fs-pitch: 30px;
  --ws-k-lh-pitch: 1.3;
  --ws-k-pitch-gap: 8px;
  --ws-k-pitch-row-gap: 22px;
  --ws-k-keys-bottom: 56px;
  --ws-k-keys-gap: 28px;
  --ws-k-key-label-gap: 12px;
  --ws-k-key: 56px;
  --ws-k-key-radius: 10px;
  --ws-k-key-border: rgba(255, 255, 255, .7);
  --ws-k-fs-key: 30px;
  --ws-k-fs-keys: 24px;
}

/* Stage screens: card, cursor-full, cursor-agent, terminal, claude-code, approve overlay.
   Values come from tokens.css; this file only lays things out. */
.ws-screen {
  position: relative; box-sizing: border-box; width: var(--ws-w); height: var(--ws-h);
  overflow: hidden; font-family: var(--ws-font-ui);
}
.ws-screen *, .ws-screen *::before, .ws-screen *::after { box-sizing: border-box; }
.ws-empty { background: var(--ws-c-bg); }
.ws-mut { color: var(--ws-c-mut); }

/* bottom-anchored area: short content on top, long content shows its newest part */
.ws-scroll { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 0; }
.ws-flow { flex: 1 0 auto; }

.ws-dots { display: flex; gap: calc(var(--ws-dot) / 2); }
.ws-dot { display: inline-block; width: var(--ws-dot); height: var(--ws-dot); border-radius: 50%; }
.ws-dot-r { background: var(--ws-dot-r); }
.ws-dot-y { background: var(--ws-dot-y); }
.ws-dot-g { background: var(--ws-dot-g); }

/* ---------- chapter card ---------- */
.ws-card { background: var(--ws-k-grad); color: var(--ws-k-fg); display: flex; align-items: center; }
.ws-card-inner { padding: 0 var(--ws-k-pad); }
.ws-card-kicker { font-size: var(--ws-k-fs-kicker); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase; opacity: var(--ws-k-kicker-op); }
.ws-card-title { margin: var(--ws-k-title-mt) 0 var(--ws-k-title-mb); font-size: var(--ws-k-fs-title); line-height: var(--ws-k-lh-title); font-weight: 700; }
.ws-card-sub { margin: 0; font-size: var(--ws-k-fs-sub); opacity: var(--ws-k-sub-op); max-width: var(--ws-k-sub-w); line-height: var(--ws-k-lh-sub); }
.ws-card-pitch { margin-top: var(--ws-k-pitch-mt); max-width: var(--ws-k-pitch-w); padding: var(--ws-k-pitch-pad);
  background: var(--ws-k-pitch-bg); border-radius: var(--ws-k-pitch-radius); }
.ws-card-pitch-k { font-size: var(--ws-k-fs-pitch-k); letter-spacing: var(--ws-k-kicker-track); text-transform: uppercase;
  opacity: var(--ws-k-kicker-op); margin-bottom: var(--ws-k-pitch-gap); }
.ws-card-pitch-ask, .ws-card-pitch-does { font-size: var(--ws-k-fs-pitch); line-height: var(--ws-k-lh-pitch); }
.ws-card-pitch-ask { font-style: italic; margin-bottom: var(--ws-k-pitch-row-gap); }
.ws-card-keys { position: absolute; left: var(--ws-k-pad); bottom: var(--ws-k-keys-bottom); display: flex;
  align-items: center; gap: var(--ws-k-keys-gap); }
.ws-card-key { display: flex; align-items: center; gap: var(--ws-k-key-label-gap); }
.ws-key { display: inline-flex; align-items: center; justify-content: center; width: var(--ws-k-key); height: var(--ws-k-key);
  border: 2px solid var(--ws-k-key-border); border-bottom-width: 5px; border-radius: var(--ws-k-key-radius);
  background: var(--ws-k-pitch-bg); font-size: var(--ws-k-fs-key); font-weight: 700; line-height: 1; }
.ws-card-key-t, .ws-card-keys-t { font-size: var(--ws-k-fs-keys); opacity: var(--ws-k-sub-op); }
.ws-card-keys-t { margin-left: var(--ws-k-keys-gap); }

/* ---------- Cursor ---------- */
.ws-cursor { display: flex; background: var(--ws-c-bg); color: var(--ws-c-tx); font-size: var(--ws-fs); line-height: var(--ws-lh); }
.ws-sb {
  width: var(--ws-c-sidebar-w); flex: none; background: var(--ws-c-side); border-right: var(--ws-line) solid var(--ws-c-line);
  display: flex; flex-direction: column; padding: var(--ws-gap) 0; font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-sb .ws-dots { padding: 0 var(--ws-gap) var(--ws-pad); }
.ws-sb-nav { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-sec { padding: var(--ws-pad) var(--ws-gap) var(--ws-pad-xs); color: var(--ws-c-mut); font-size: var(--ws-fs-xs); }
.ws-sb-repo { padding: var(--ws-pad-xs) var(--ws-gap); }
.ws-sb-chat {
  display: flex; gap: var(--ws-pad-sm); justify-content: space-between;
  margin: 0 var(--ws-pad-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm) var(--ws-pad-xs) var(--ws-pad);
  border-radius: var(--ws-radius-sm);
}
.ws-sb-chat-t { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.ws-sb-chat b { font-weight: 400; color: var(--ws-c-mut); flex: none; }
.ws-sb-chat.ws-on { background: var(--ws-c-sel); color: var(--ws-c-tx); }
.ws-me { margin-top: auto; padding: var(--ws-gap); display: flex; align-items: center; gap: var(--ws-pad-sm); line-height: var(--ws-lh-tight); }
.ws-avatar { width: var(--ws-c-avatar-s); height: var(--ws-c-avatar-s); border-radius: 50%; background: var(--ws-c-avatar); flex: none; }

.ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ws-top {
  height: var(--ws-c-top-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-pad);
  font-size: var(--ws-fs-sm); color: var(--ws-c-tx2);
}
.ws-top-r { margin-left: auto; color: var(--ws-c-mut); font-size: var(--ws-fs-xs); white-space: pre; }
.ws-conv { flex: 1; padding: 0 var(--ws-pad); }
.ws-conv .ws-flow { display: flex; flex-direction: column; gap: var(--ws-gap); padding-bottom: var(--ws-gap); }
.ws-ask {
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius); padding: var(--ws-gap) var(--ws-gap) var(--ws-pad-sm);
  box-shadow: var(--ws-c-shadow); background: var(--ws-c-bg); white-space: pre-wrap;
}
.ws-ask-row { display: flex; align-items: center; gap: var(--ws-gap); margin-top: var(--ws-pad-sm); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); white-space: normal; }
.ws-send {
  margin-left: auto; width: var(--ws-c-send-s); height: var(--ws-c-send-s); border-radius: 50%;
  background: var(--ws-c-send-bg); color: var(--ws-c-send-fg); display: flex; align-items: center; justify-content: center; font-size: var(--ws-fs-xs);
}
.ws-worked { color: var(--ws-c-mut); }
.ws-tool {
  align-self: flex-start; font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); color: var(--ws-c-tx2);
  background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-xs) var(--ws-pad-sm);
  white-space: pre-wrap; word-break: break-word;
}
.ws-ran { display: flex; flex-direction: column; gap: var(--ws-pad-xs); }
.ws-ran-out {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); line-height: var(--ws-lh-mono); color: var(--ws-z-out);
  border: var(--ws-line) solid var(--ws-c-line); border-radius: var(--ws-radius-sm); padding: var(--ws-pad-sm) var(--ws-gap);
}
.ws-ran-out .ws-out { white-space: pre-wrap; word-break: break-word; }
.ws-say p, .ws-say ul, .ws-say h4 { margin: 0 0 var(--ws-pad-sm); }
.ws-say > :last-child { margin-bottom: 0; }
.ws-say h4 { font-size: var(--ws-fs-h4); margin-top: var(--ws-pad-xs); }
.ws-say ul { padding-left: var(--ws-pad); }
.ws-md-table { overflow-x: auto; margin: 0 0 var(--ws-pad-sm); }
.ws-md-table table { border-collapse: collapse; font-size: var(--ws-fs-sm); }
.ws-md-table th, .ws-md-table td {
  border: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-pad-xs) var(--ws-pad-sm); text-align: left;
  white-space: nowrap;
}
.ws-md-table th { font-weight: 600; }
.ws-cursor code {
  font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono); background: var(--ws-c-code);
  border-radius: var(--ws-radius-xs); padding: 0 var(--ws-pad-xs);
}
.ws-followup {
  flex: none; margin: var(--ws-pad-sm) var(--ws-pad) var(--ws-pad-xs); border: var(--ws-line) solid var(--ws-c-line);
  border-radius: var(--ws-radius); padding: var(--ws-pad-sm) var(--ws-gap); display: flex; color: var(--ws-c-faint);
  font-size: var(--ws-fs-sm); box-shadow: var(--ws-c-shadow); white-space: pre;
}
.ws-followup-m { margin-left: auto; color: var(--ws-c-mut); }
.ws-foot { flex: none; display: flex; gap: var(--ws-pad); padding: var(--ws-pad-xs) var(--ws-pad) var(--ws-gap); color: var(--ws-c-mut); font-size: var(--ws-fs-sm); }

/* right panel (cursor-full) */
.ws-rp { width: var(--ws-c-right-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); display: flex; flex-direction: column; font-size: var(--ws-fs-sm); }
.ws-rp-tabs { height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: 0 var(--ws-gap); color: var(--ws-c-mut); }
.ws-tab.ws-on { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); font-style: italic; color: var(--ws-c-tx); }
.ws-rp-sub {
  height: var(--ws-c-tabs-h); flex: none; display: flex; align-items: center; padding: 0 var(--ws-gap);
  color: var(--ws-c-tx2); border-top: var(--ws-line) solid var(--ws-c-line); border-bottom: var(--ws-line) solid var(--ws-c-line); white-space: pre;
}
.ws-rp-sub-r { margin-left: auto; display: flex; gap: var(--ws-pad-sm); color: var(--ws-c-mut); }
.ws-pill { background: var(--ws-c-chip); border-radius: var(--ws-radius-sm); padding: 0 var(--ws-pad-sm); color: var(--ws-c-tx); }
.ws-rp-files { flex: 1; min-height: 0; display: flex; }
.ws-preview { flex: 1; padding: var(--ws-pad); }
.ws-preview h1 { margin: var(--ws-pad-sm) 0 0; font-size: var(--ws-c-preview-fs); }
.ws-tree { width: var(--ws-c-tree-w); flex: none; border-left: var(--ws-line) solid var(--ws-c-line); padding: var(--ws-gap) var(--ws-pad-sm); color: var(--ws-c-tx2); line-height: var(--ws-lh-list); }
.ws-tree-h { color: var(--ws-c-mut); padding: 0 var(--ws-pad-xs); }
.ws-tree-i { padding: 0 var(--ws-pad-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-zsh { height: var(--ws-c-zsh-h); flex: none; border-top: var(--ws-line) solid var(--ws-c-line); background: var(--ws-z-bg); display: flex; flex-direction: column; }
.ws-zsh-tabs { flex: none; display: flex; align-items: center; gap: var(--ws-gap); padding: var(--ws-pad-sm) var(--ws-gap) 0; color: var(--ws-c-mut); }
.ws-zsh-title { flex: none; padding: var(--ws-pad-sm) var(--ws-gap); color: var(--ws-c-tx2); }
.ws-zsh-body {
  flex: 1; padding: 0 var(--ws-gap) var(--ws-pad-sm); font-family: var(--ws-font-mono); font-size: var(--ws-fs-mono);
  line-height: var(--ws-lh-mono); color: var(--ws-z-tx);
}

/* Open Tabs column (cursor-agent) */
.ws-opentabs { width: var(--ws-c-opentabs-w); flex: none; padding: var(--ws-c-top-h) var(--ws-pad) var(--ws-pad); color: var(--ws-c-tx2); font-size: var(--ws-fs-sm); line-height: var(--ws-lh-list); }
.ws-ot-h { color: var(--ws-c-mut); font-size: var(--ws-fs-xs); margin-top: var(--ws-gap); }
.ws-ot-h:first-child { margin-top: 0; }
.ws-plus { color: var(--ws-c-plus); }

/* ---------- shell lines (zsh in Cursor and personal terminal) ---------- */
.ws-prompt { display: flex; align-items: center; white-space: nowrap; margin-top: var(--ws-pad-xs); }
.ws-seg {
  display: inline-block; padding: 0 calc(var(--ws-seg-slant) + var(--ws-pad-xs));
  clip-path: polygon(var(--ws-seg-slant) 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%);
  margin-right: calc(var(--ws-seg-slant) / -2);
}
.ws-seg-apple { clip-path: polygon(0 0, 100% 0, calc(100% - var(--ws-seg-slant)) 100%, 0 100%); }
.ws-seg-fill { flex: 1; align-self: center; height: 0; margin: 0 var(--ws-pad-sm); border-bottom: var(--ws-fill-w) dotted; }
.ws-ico { display: inline-block; width: var(--ws-icon-s); height: var(--ws-icon-s); vertical-align: var(--ws-icon-drop); }

order_total('A1', discount_pct=150))\"","out":["-50.0"],"source":"real","cwd":"~/mi-servicio/api","notes":"Primer candidato, probado de verdad: un pedido de 100 con 150% de descuento. Fijate el resultado: da menos 50. El total queda negativo; esto sí es un hallazgo, con evidencia que cualquiera puede repetir."},{"type":"term","cmd":"python3 -c \"from mi_servicio import stats; print(stats.paginate([1, 2, 3, 4], 1, 2))\"","out":["[3, 4]"],"source":"real","cwd":"~/mi-servicio/api","notes":"Segundo candidato: el docstring dice que las páginas empiezan en 1, pero pedir la página 1 devuelve la segunda, 3 y 4. Otra vez, evidencia ejecutada, no opinión."},{"type":"tool","label":"Ran · counter.hit() desde 8 hilos · el total dio lo esperado","source":"inferido","notes":"Del tercer candidato, la carrera del contador, el agente intentó reproducirla y no pudo. Eso no lo descarta, pero tampoco lo deja pasar como cierto: va al informe como «unverified». Esta es la honestidad que buscamos."},{"type":"tool","label":"Write · AUDIT-REPORT.md","source":"inferido","notes":"Un archivo local, que ya está ignorado. Cada hallazgo lleva dimensión, severidad, evidencia, por qué importa, arreglo propuesto y, obligatoria, la confianza."},{"type":"say","md":"#### Informe listo: AUDIT-REPORT.md\n#### F-01 · Un descuento de más del 100% deja el total negativo\n**Dimensión:** clean code · **Severidad:** media · **Confianza:** verified by execution\n#### F-02 · La paginación dice «desde 1» pero salta una página\n**Dimensión:** documentación · **Severidad:** baja · **Confianza:** verified by execution\n#### F-03 · Dos pedidos a la vez pueden contarse como uno\n**Dimensión:** resiliencia · **Severidad:** baja · **Confianza:** unverified, reasoning only\n\nF-03 queda **sin verificar**: lo reporto, pero no lo publico. No toqué GitHub. **¿Cuáles publico?**","source":"inferido","notes":"Este es el momento clave del episodio. El agente frena y pregunta; no publicó nada. Leé la confianza de cada uno y señal tle":"Antes de pushear, chequeos que cuestan menos que descubrirlos en CI","screen":"cursor-agent","faq":[{"q":"¿Por qué marca un nombre de test como secreto?","a":"Porque el detector de TruffleHog toma cualquier palabra de 40 caracteres alfanuméricos como un secreto verificado y rompe el CI. Hay nombres de test que justo miden 40."},{"q":"¿Qué es el tooling local?","a":"Carpetas de herramientas del editor o del agente, como .serena o .idea. Un git add -A las mete en el PR de otra persona sin que te des cuenta."},{"q":"¿Cuándo dice «limpio»?","a":"Solo cuando pudo comparar y no encontró nada. Si no puede comparar, por ejemplo con una rama base que no existe, se niega a decir limpio."},{"q":"¿Puedo correrlo yo, sin el agente?","a":"Sí: son scripts sueltos. Parado en tu repo, corrés sweep.sh con la rama base. Lo mismo con check-attribution.sh."}],"steps":[{"type":"ask","text":"Voy a pushear: pasá el sweep y chequeá que nada indique que lo hizo un LLM","source":"inferido","notes":"Dos pedidos en una frase. La skill los resuelve con dos scripts: el sweep y el chequeo de atribución. Es un segundo push: ya hay PRs abiertos y la persona vuelve a pedir el chequeo antes de empujar un cambio nuevo."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh main","out":["── sweeping fix/descuento-sin-tope against main ──","✗ 40-char identifiers (TruffleHog Lob false positive):","    api/tests/test_orders.py:test_discount_above_100_keeps_total_zero","✗ local tooling in the diff:","    .serena/project.yml","✓ no LLM attribution (commits, diff, branch, GitHub, Jira)","· no pinned action SHAs to verify","✓ no mutable action refs","","sweep found problems — fix before pushing","# exit 1"],"source":"inferido","cwd":"~/mi-servicio","notes":"Dos problemas, y los dos son de los que no se ven a simple vista. Un nombre de test de exactamente 40 caracteres, que TruffleHog tomaría por un secreto, y un archivo de .serena dentro del diff, que se coló con un git add -A. Inferido: el sweep usa rg, que no está en la captura; la salida sigue la de la documentación."},{"type":"say","md":"No pusheo. El sweep encontró dos problemas:\n- Un nombre de test de 40 caracteres en `api/tests/test_orders.py`: el detector de TruffleHog lo marcaría como secreto.\n- Un archivo de `.serena/` en el diff.\n\nLos saco, enmiendo el commit y vuelvo a correr el sweep.","source":"inferido","notes":"El agente se frena solo y dice por qué. No empuja «y vemos en CI». Es el valor del sweep: el error cuesta un minuto acá y una tarde en un PR ajeno."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/sweep.sh main","out":["── sweeping fix/descuento-sin-tope against main ──","✓ no 40-char identifiers","✓ no local tooling files","✓ no LLM attribution (commits, diff, branch, GitHub, Jira)","· no pinned action SHAs to verify","✓ no mutable action refs","","sweep clean","# exit 0"],"source":"inferido","cwd":"~/mi-servicio","notes":"Después de arreglar, el mismo comando. Fijate el punto en «no pinned action SHAs»: no es un tilde, es un punto. Significa que no había nada para chequear, no que se chequeó y estaba bien. La skill distingue las dos cosas a propósito."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/check-attribution.sh main","out":["── attribution sweep: fix/descuento-sin-tope vs main ──","✓ commits clean (author, committer, body, trailers)","✓ diff contents clean","✓ branch name clean","✓ GitHub clean (4 items, 0 with own comments)","· skipped Jira (env vars not set)","","no attribution found on any reachable surface","# exit 0"],"source":"inferido","cwd":"~/mi-servicio","notes":"El segundo pedido: que nada indique que lo hizo un asistente. Mira los commits, el diff, la rama, los PRs y issues de GitHub y, si hay credenciales, Jira. Fijate la última línea: dice «en cualquier superficie alcanzable», no «sin atribución». Lo que no pudo leer figura como salteado con un punto, nunca como limpio."}]},{"id":"jira-y-review","title":"Otro caso: Jira y la review","subtitle":"Vincular los PRs a un ticket y contestar al revisor automático","screen":"cursor-agent","faq":[{"q":"¿Crea tickets en Jira por cada hallazgo?","a":"No. Los hallazgos van a issues de GitHub. Con Jira la skill solo comenta en tickets que ya existen y vincula PRs."},{"q":"¿Por qué no renombra la rama?","a":"Porque, según la documentación de GitHub, si renombrás la rama de un PR abierto, el PR se cierra. Para PRs que ya existen, la clave va en el título."},{"q":"¿Por qué la clave va al final del título?","a":"Para no romper el prefijo de los conventional commits, como fix:. Jira escanea el título entero, así que lo encuentra igual. Y la clave va en mayúsculas."}],"steps":[{"type":"ask","text":"Vinculá estos PRs al ticket PLAT-123","source":"inferido","notes":"Un pedido corto. Jira vincula un PR cuando la clave aparece en el nombre de la rama, en un commit o en el título del PR."},{"type":"say","md":"Los PRs #23 y #24 ya existen, así que **no renombro sus ramas**: GitHub cierra un PR si se renombra su rama.\n\nLes agrego la clave al final del título: `fix: … (PLAT-123)`.","source":"inferido","notes":"Esta es la regla que más cuesta aprender a las malas. La rama de un PR abierto no se toca. El título sí, y es no destructivo. Si ya sabías el ticket antes de empezar, la clave se pone en el nombre de la rama desde el principio."},{"type":"tool","label":"Ran · gh pr edit 23 y gh pr edit 24 · título con (PLAT-123)","source":"inferido","notes":"Dos comandos, uno por PR. Escribe en GitHub, pero sobre PRs que la persona ya aprobó publicar en esta misma conversación."},{"type":"ask","text":"Contestá los comentarios del revisor automático","source":"inferido","notes":"Después de publicar, llegan los comentarios de un revisor automático. Son útiles, pero no tienen la última palabra."},{"type":"say","md":"Verifiqué cada comentario antes de contestar:\n- **Comentario 1: tiene razón.** El borde de la página 0 también falla; lo arreglo.\n- **Comentario 2: no ue pasa en silencio cuando no pudo correr es peor que no tener chequeo."},{"type":"term","cmd":"~/.agents/skills/auditing-repos/scripts/preflight.sh | grep -A2 '^jira auth'","out":["jira auth                  HTTP 401 — token expired or revoked, NOT a permissions problem","  note                     an unauthenticated Jira returns 404 for real tickets. Never conclude","                           'the ticket does not exist' from a 404 while /myself returns 401."],"source":"inferido","cwd":"~/mi-servicio","notes":"Tercer síntoma, con Jira: un 401 es un token vencido, no un tema de permisos. Lo importante es la nota: una Jira sin autenticar devuelve 404 para tickets que sí existen, así que jamás se concluye «el ticket no existe» mientras el 401 siga. Inferido: necesita credenciales y red."}]},{"id":"cierre","title":"Cierre","subtitle":"Lo que te llevás","screen":"cursor-agent","faq":[{"q":"¿Cuándo la uso?","a":"Cuando vas a entregar un repo a otro equipo, antes de clonar una plantilla muchas veces, o cuando querés que los hallazgos terminen en issues y PRs."},{"q":"¿Sirve para revisar un PR?","a":"No. Para un diff puntual usá el revisor de tu host, por ejemplo /code-review. Esta skill es para un repositorio entero."},{"q":"¿Qué necesito para el próximo episodio?","a":"Lo mismo del episodio 0. Cada episodio empieza instalando su skill."}],"steps":[{"type":"ask","text":"¿Qué me llevo de esto?","source":"inferido","notes":"Cerrá con las tres ideas; no repitas el episodio."},{"type":"say","md":"#### Lo que te llevás\n- **Un hallazgo sin verificar no es un hallazgo:** cada cosa que se publica salió de ejecutar algo, y lo que no, se reporta pero no sale.\n- **Una compuerta antes de publicar:** el agente frena con el informe y espera tu respuesta. Es una instrucción, no un candado: leé el informe.\n- **Nada indica que lo hizo un asistente:** ni en commits ni en issues ni en PRs, y el sweep lo comprueba.\n\n#### Próximo episodio: local-board-skill\nCómo mantener un tablero de   function build(ep, index) {

    if (ch.screen === "cursor-agent") return cursorScreen(ep, ch, e.step, false);

  function step(container, ep, index) {
    while (container.firstChild) container.removeChild(container.firstChild);
    container.appendChild(build(ep, index));
    return container.firstChild;
  }

  var api = {step: step, markdown: markdown, clockText: clockText,

  return api;
})();

<script>
// Forward animation of ONE step, plus the playback policy as pure functions.
//
// Animate.run(container, episode, index, opts) -> {cancel(), done: Promise}
//   Renders the finished state with Render.step(container, episode, index), hides the
//   current step's hooks (see render.js header) and reveals them in document order on
//   the injected scheduler, so it looks like the step at `index` playing on top of
//   Render.step(index - 1). Both completion and cancel() end with a fresh
//   Render.step(container, episode, index): the final DOM is identical by construction.
//   `done` resolves in both cases (never rejects). A new run on the same container
//   cancels the previous one first, and a reveal that throws ends the run in the final
//   state too. A page or approve step is the exception: its window holds an iframe that a
//   fresh render would rebuild (blank until it loads again), so when it completes on its
//   own the run only clears the inline styles it set, which leaves the same DOM.
// Animate.stop(container): cancels the active run on `container` without rendering
//   (call it before a static Render.step, e.g. on a back-step).
//   opts: {speed = 1 (clamped to >= 0.1), schedule(fn, ms) -> id = setTimeout,
//          unschedule(id) = clearTimeout, now() = Date.now (accepted, not used: every
//          wait goes through schedule)}.
//
// Timing (every value is divided by speed):
//   type  28 ms per character (code points), the text grows one character per tick
//   line  120 ms per line / say block
//   node  250 ms, then the node appears whole (tool, worked, chips)
//   fade  250 ms for a card, an approve window and a page: opacity 0 until the tick.
//         A page right after a page (or an approve right after an approve) keeps the window
//         on screen and only waits: the browser does not blink between them (continuesWindow).
//   autoplay delay between steps 900 ms
// Animate.stepDuration walks the same plan the animation schedules, so the estimate
// and the playback cannot drift apart.
var Animate = (function () {
  var CHAR_MS = 28;
  var LINE_MS = 120;
  var NODE_MS = 250;
  var FADE_MS = 250;
  var AUTOPLAY_MS = 900;
  var MIN_SPEED = 0.1;

  function speedOf(s) {
    s = Number(s);
    if (!(s > 0)) s = MIN_SPEED;
    return Math.max(s, MIN_SPEED);
  }
  function chars(text) { return Array.from(String(text || "")); }
  function hide(n) { n.style.display = "none"; }
  function show(n) { n.style.display = ""; }

  // True when the step at `index` is a page or approve right after another of the same type
  // in its chapter: the window was already on screen, so it does not fade in again.
  function continuesWindow(ep, index) {
    var flat = Nav.flatten(ep);
    var e = flat[Nav.clamp(ep, index)];
    if (!e || e.step < 1 || (e.kind !== "page" && e.kind !== "approve")) return false;
    return ep.chapters[e.chapter].steps[e.step - 1].type === e.kind;
  }

  // Render the finished state into `container`, hide what the step at `index` adds and
  // return the reveal plan: [{ms, fn}] in order (ms already divided by speed).
  function prepare(container, ep, index, speed) {
    Render.step(container, ep, index);
    var flat = Nav.flatten(ep);
    if (!flat.length) return [];
    var e = flat[Nav.clamp(ep, index)];
    var plan = [];
    var screen = container.firstChild;
    if (e.step === -1) {
      screen.style.opacity = "0";
      plan.push({ms: FADE_MS / speed, fn: function () { screen.style.opacity = "1"; }});
      return plan;
    }
    var root = container.querySelector('[data-step="' + e.step + '"]');
    if (!root) return plan;
    var step = ep.chapters[e.chapter].steps[e.step];
    // The idle prompt lives in the zsh panel (cursor-full) and on the terminal screen: hide
    // it only when this step plays in that same flow, not for a chat-placed agent command.
    // On claude-code, `in: "zsh"` is the person's `!` line and there is no idle prompt, so
    // the lookup below finds nothing.
    if (step.type === "term" && (step["in"] === "zsh" || ep.chapters[e.chapter].screen === "terminal")) {
      var idle = container.querySelector('[data-anim="idle"]');
      if (idle) hide(idle);
    }
    var hooks = [];
    if (root.hasAttribute("data-anim")) hooks.push(root);
    Array.prototype.forEach.call(root.querySelectorAll("[data-anim]"), function (n) { hooks.push(n); });
    hooks.forEach(function (n) {
      var kind = n.getAttribute("data-anim");
      if (kind === "type") {
        var cs = chars(n.textContent);
        n.textContent = "";
        cs.forEach(function (_, k) {
          plan.push({ms: CHAR_MS / speed, fn: function () { n.textContent = cs.slice(0, k + 1).join(""); }});
        });
      } else if (kind === "line") {
        hide(n);
        plan.push({ms: LINE_MS / speed, fn: function () { show(n); }});
      } else if (kind === "node" && (step.type === "approve" || step.type === "page") && n === root) {
        if (continuesWindow(ep, index)) {
          plan.push({ms: FADE_MS / speed, fn: function () {}});
        } else {
          n.style.opacity = "0";
          plan.push({ms: FADE_MS / speed, fn: function () { n.style.opacity = ""; }});
        }
      } else if (kind === "node") {
        hide(n);
        plan.push({ms: NODE_MS / speed, fn: function () { show(n); }});
      }
    });
    if (step.type === "approve" || step.type === "page") {
      plan.finish = function () {
        hooks.forEach(function (n) { if (n.getAttribute("style") === "") n.removeAttribute("style"); });
      };
    }
    return plan;
  }

  // One active run per container: a new run (or stop) cancels the previous one first.
  var active = typeof WeakMap === "function" ? new WeakMap() : null;
  function getActive(c) { return active ? active.get(c) : c.__wsAnimRun; }
  function setActive(c, r) { if (active) active.set(c, r); else c.__wsAnimRun = r; }
  function clearActive(c, r) {
    if (getActive(c) !== r) return;
    if (active) active.delete(c); else delete c.__wsAnimRun;
  }

  // Cancel any active run on `container` without rendering (its `done` resolves).
  function stop(container) {
    var r = getActive(container);
    if (r) r.abort();
  }

  function run(container, ep, index, opts) {
    opts = opts || {};
    stop(container);
    var speed = speedOf(opts.speed === undefined ? 1 : opts.speed);
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };
    var finished = false, timer = null, resolveDone;
    var done = new Promise(function (resolve) { resolveDone = resolve; });
    var handle = {cancel: function () { end(true); }, done: done, abort: function () { end(false); }};
    setActive(container, handle);
    var plan = prepare(container, ep, index, speed);

    function end(render) {
      if (finished) return;
      finished = true;
      if (timer !== null) { unschedule(timer); timer = null; }
      clearActive(container, handle);
      if (render) Render.step(container, ep, index);
      resolveDone();
    }
    function next(k) {
      if (finished) return;
      if (k >= plan.length) {
        if (plan.finish) { plan.finish(); end(false); } else end(true);
        return;
      }
      timer = schedule(function () {
        timer = null;
        if (finished) return;
        try {
          plan[k].fn();
        } catch (err) {
          // A broken reveal must not stall playback: jump to the final state.
          if (typeof console !== "undefined") console.error("Animate: reveal failed", err);
          end(true);
          return;
        }
        next(k + 1);
      }, plan[k].ms);
    }
    next(0);
    return {cancel: handle.cancel, done: done};
  }

  // Sum of the ms the animation of `index` schedules (same plan, detached container).
  function stepDuration(ep, index, speed) {
    var plan = prepare(document.createElement("div"), ep, index, speedOf(speed));
    return plan.reduce(function (s, a) { return s + a.ms; }, 0);
  }

  // What autoplay does after `index` finished animating.
  function autoplay(ep, index, speed) {
    var flat = Nav.flatten(ep);
    var i = Nav.clamp(ep, index);
    if (!flat.length || i >= flat.length - 1) return {stop: true, delay: 0};
    var e = flat[i];
    var steps = ep.chapters[e.chapter].steps || [];
    if (e.step === steps.length - 1) return {stop: true, delay: 0};  // also an empty chapter's card
    if (e.step >= 0 && steps[e.step].pause) return {stop: true, delay: 0};
    return {stop: false, delay: AUTOPLAY_MS / speedOf(speed)};
  }

  // Estimated length: step animations plus autoplay delays (none after a stop).
  function episodeDuration(ep, speed) {
    var flat = Nav.flatten(ep);
    var chapters = (ep.chapters || []).map(function (ch) { return {id: ch.id, ms: 0}; });
    var total = 0;
    flat.forEach(function (e, i) {
      var a = autoplay(ep, i, speed);
      var ms = stepDuration(ep, i, speed) + (a.stop ? 0 : a.delay);
      chapters[e.chapter].ms += ms;
      total += ms;
    });
    return {total: total, chapters: chapters};
  }

  return {run: run, stop: stop, continuesWindow: continuesWindow, stepDuration: stepDuration, autoplay: autoplay, episodeDuration: episodeDuration,
          CHAR_MS: CHAR_MS, LINE_MS: LINE_MS, NODE_MS: NODE_MS, FADE_MS: FADE_MS, AUTOPLAY_MS: AUTOPLAY_MS};
})();

<script>
// Stage page: what the audience sees. It holds (episode, index), renders or animates on
// `show` and answers the control. Messages (see the episode format):
//   in : {type:"show", episode, index, animate, speed} | {type:"blackout", on} | {type:"ping"}
//        {type:"wait", delay, seq} | {type:"wait-cancel"}
//   out: {type:"ready"} on load, {type:"shown", episode, index}, then
//        {type:"done-animating", index} (only for the latest show), {type:"pong"},
//        {type:"advance", seq} when a wait ends,
//        {type:"key", key, shift} for the presenter's keys pressed while the stage has focus.
// The stage times the autoplay delay (`wait`) because its window is the visible one:
// the control's timers may be throttled while the stage has focus. A new show, a new wait
// or wait-cancel drops the pending wait.
// A `show` animates only when animate is true and index == current + 1 in the same
// episode; anything else cancels the running animation and renders the finished state.
// The stage never shows notes, sources or the skill commit: it only calls Render.step.
//
// Stage.create(opts) -> {handle(msg) -> Promise, current(), animating()} is the testable core;
//   animating() is true from an animated show until its animation ends or another show replaces it:
//   opts: {canvas (Render container), blackout (element toggled with .hidden), episodes,
//          post(msg), schedule?, unschedule? (passed to Animate.run)}.
// Stage.tickClock(canvas) sets the idle prompt's time text (.ws-time inside
//   [data-anim="idle"]) to Render.now(); it touches nothing else, so it never re-renders
//   a step or disturbs a running animation. The page calls it every second.
// Stage.localMove(ep, index, key, shift, animating) -> {index, animate} | null: where the
//   presenter keys go when no control drives the page (opened from its link). → / PageDown /
//   space step forward animated, ← / PageUp step back finished, shift jumps chapters; null at
//   the ends or for any other key. While the current step still animates, → / space show it
//   finished instead (the same index), so a long output is never skipped. Stage.hashFor(id, index) is the "#id/N" parseHash reads.
// The DOM bootstrap at the end runs only on the page with #ws-stage-root. The page is
// driven when the control opened it (window "ws-stage" with an opener); otherwise it
// navigates by itself and keeps the step in the hash, so a reload stays put.
var Stage = (function () {
  var FADE = "ws-fade-in";

  function create(opts) {
    var canvas = opts.canvas, blackout = opts.blackout;
    var post = opts.post || function () {};
    var byId = {};
    (opts.episodes || []).forEach(function (ep) { if (ep && ep.id) byId[ep.id] = ep; });
    var cur = null;   // {episode, index} of the latest show
    var seq = 0;      // id of the latest show; older runs stay silent
    var running = false;  // an animated show has not finished yet
    var schedule = opts.schedule || function (fn, ms) { return setTimeout(fn, ms); };
    var unschedule = opts.unschedule || function (id) { clearTimeout(id); };
    var waiting = null;  // timer id of the pending wait
    function cancelWait() {
      if (waiting !== null) { unschedule(waiting); waiting = null; }
    }
    function onWait(msg) {
      cancelWait();
      var delay = Math.max(Number(msg.delay) || 0, 0);
      waiting = schedule(function () {
        waiting = null;
        post({type: "advance", seq: msg.seq});
      }, delay);
    }
    if (blackout) blackout.hidden = true;

    function fades(ep, index) {
      var e = Nav.flatten(ep)[index];
      return !!e && (e.kind === "card" || e.kind === "approve" || e.kind === "page") && !Animate.continuesWindow(ep, index);
    }

    function onShow(msg) {
      var ep = byId[msg.episode];
      if (!ep) return Promise.resolve();
      var index = Nav.clamp(ep, msg.index);
      var id = ++seq;
      cancelWait();
      var animate = msg.animate === true && cur !== null && cur.episode === ep.id && index === cur.index + 1;
      cur = {episode: ep.id, index: index};
      canvas.classList.remove(FADE);
      running = animate;
      if (!animate) {
        Animate.stop(canvas);
        Render.step(canvas, ep, index);
        post({type: "shown", episode: ep.id, index: index});
        post({type: "done-animating", index: index});
        return Promise.resolve();
      }
      var speed = Math.max(Number(msg.speed) || 1, 0.1);
      if (fades(ep, index)) {
        canvas.style.setProperty("--ws-fade-ms", Math.round(Animate.FADE_MS / speed) + "ms");
        canvas.classList.add(FADE);
      }
      var run = Animate.run(canvas, ep, index, {speed: speed, schedule: schedule, unschedule: unschedule});
      post({type: "shown", episode: ep.id, index: index});
      return run.done.then(function () {
        if (id !== seq) return;
        running = false;
        // Same task as Animate's final render: the fresh node never starts the fade.
        canvas.classList.remove(FADE);
        post({type: "done-animating", index: index});
      });
    }

    function handle(msg) {
      if (!msg || typeof msg !== "object") return Promise.resolve();
      if (msg.type === "show") return onShow(msg);
      if (msg.type === "blackout") { if (blackout) blackout.hidden = !msg.on; }
      else if (msg.type === "ping") post({type: "pong"});
      else if (msg.type === "wait") onWait(msg);
      else if (msg.type === "wait-cancel") cancelWait();
      return Promise.resolve();
    }

    return {handle: handle, current: function () { return cur; }, animating: function () { return running; }};
  }

  // Refresh only the idle prompt's clock text; returns how many were updated.
  function tickClock(canvas) {
    var text = Render.clockText(Render.now());
    var spans = canvas.querySelectorAll('[data-anim="idle"] .ws-time');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].textContent !== text) spans[i].textContent = text;
    }
    return spans.length;
  }

  // The keydown the stage forwards to the control, or null.
  function keyMessage(ev) {
    if (!ev || !Nav.keyAction(ev.key) || ev.repeat || ev.metaKey || ev.ctrlKey || ev.altKey) return null;
    return {type: "key", key: ev.key, shift: !!ev.shiftKey};
  }

  // Static preview hook: "#<episode-id>/<step>" -> {episode, index}, or null. The step is
  // 1-based, like the "paso N de M" on the control: #id/1 is index 0 (#id/0 is rejected).
  function parseHash(hash) {
    var m = /^#([A-Za-z0-9._-]+)\/(\d+)$/.exec(typeof hash === "string" ? hash : "");
    var n = m ? parseInt(m[2], 10) : 0;
    return n >= 1 ? {episode: m[1], index: n - 1} : null;
  }

  function localMove(ep, index, key, shift, animating) {
    var k = Nav.keyAction(key), last = Nav.flatten(ep).length - 1, target;
    if ((k === "right" || k === "space") && !shift && animating) return {index: index, animate: false};
    if ((k === "right" || k === "left") && shift) {
      target = k === "right" ? Nav.nextChapter(ep, index) : Nav.prevChapter(ep, index);
      return target === index ? null : {index: target, animate: false};
    }
    if (k === "right" || k === "space") return index >= last ? null : {index: index + 1, animate: true};
    if (k === "left") return index <= 0 ? null : {index: index - 1, animate: false};
    return null;
  }

  function hashFor(id, index) { return "#" + id + "/" + (index + 1); }

  function readEpisodes() {
    var node = document.getElementById("episodes");
    if (!node) return [];
    try {
      var data = JSON.parse(node.textContent);
      return Array.isArray(data) ? data : [];
    } catch (e) {
      return [];
    }
  }

  // Scale the 1600x900 frame to fit the window, letterboxed on black.
  function fit(frame) {
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    frame.style.transform = "translate(-50%, -50%) scale(" + s + ")";
  }

  function boot() {
    if (!document.getElementById("ws-stage-root")) return;
    var frame = document.getElementById("ws-frame");
    var opener = window.name === "ws-stage" ? window.opener : null;
    function post(msg) { if (opener && !opener.closed) opener.postMessage(msg, "*"); }
    var canvas = document.getElementById("ws-canvas");
    var blackout = document.getElementById("ws-blackout");
    var episodes = readEpisodes();
    var stage = create({canvas: canvas, blackout: blackout, episodes: episodes, post: post});
    window.addEventListener("message", function (ev) {
      if (!opener || ev.source !== opener) return;
      stage.handle(ev.data);
    });
    document.addEventListener("keydown", function (ev) {
      var msg = keyMessage(ev);
      if (!msg) return;
      ev.preventDefault();
      if (opener) post(msg);
      else moveAlone(msg);
    });
    function moveAlone(msg) {
      if (Nav.keyAction(msg.key) === "b") { blackout.hidden = !blackout.hidden; return; }
      var cur = stage.current(), ep = null;
      episodes.forEach(function (e) { if (cur && e.id === cur.episode) ep = e; });
      var to = ep && localMove(ep, cur.index, msg.key, msg.shift, stage.animating());
      if (!to) return;
      history.replaceState(null, "", hashFor(ep.id, to.index));
      stage.handle({type: "show", episode: ep.id, index: to.index, animate: to.animate, speed: 1});
    }
    setInterval(function () { tickClock(canvas); }, 1000);
    fit(frame);
    window.addEventListener("resize", function () { fit(frame); });
    if (!opener) {
      // No control driving this page: the hash picks the finished step to show (the first one
      // without a hash) and the presenter keys move from there (moveAlone).
      var preview = function () {
        var h = parseHash(location.hash) || (episodes[0] ? {episode: episodes[0].id, index: 0} : null);
        if (h) stage.handle({type: "show", episode: h.episode, index: h.index, animate: false});
      };
      window.addEventListener("hashchange", preview);
      preview();
    }
    post({type: "ready"});
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();

  return {create: create, keyMessage: keyMessage, parseHash: parseHash, tickClock: tickClock,
          localMove: localMove, hashFor: hashFor};
})();

</script>
</body>
</html>
